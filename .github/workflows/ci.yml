name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to an immutable commit rather than a moving tag.
      # Full depth: the exposure review reads every commit and every blob ever
      # committed, because publication is one way and a deleted branch is still
      # published.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: exposure review
        run: ./scripts/exposure-review.sh
      # CI runs exactly what a contributor runs locally: the same script, the
      # same images, the same container boundary.
      - name: verify
        run: ./scripts/demo.sh verify

      # The intentionally vulnerable demonstration is not part of the default
      # workflow. It runs here, deliberately acknowledged, because the exposures
      # it produces are the regressions this project must never lose.
      - name: vulnerable demonstration
        env:
          ALLOW_VULNERABLE_DEMO: "true"
        run: ./scripts/demo.sh vulnerable
